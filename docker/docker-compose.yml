version: '3.8'

services:
  # ──────────────────────────────────────────────
  # JOOMLA 5 (CMS)
  # ──────────────────────────────────────────────
  joomla:
    build:
      context: ..
      dockerfile: docker/Dockerfile.joomla
    container_name: aas-joomla
    restart: unless-stopped
    environment:
      JOOMLA_DB_HOST: db
      JOOMLA_DB_USER: joomla
      JOOMLA_DB_PASSWORD: ${JOOMLA_DB_PASSWORD:-joomla}
      JOOMLA_DB_NAME: joomla
      JOOMLA_SITE_NAME: "Absolute Adventure Safaris"
      JOOMLA_ADMIN_USER: admin
      JOOMLA_ADMIN_PASSWORD: ${JOOMLA_ADMIN_PASSWORD:-changeme123}
      JOOMLA_ADMIN_EMAIL: ${JOOMLA_ADMIN_EMAIL:-admin@localhost}
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_MAX_FILESIZE: 64M
      PHP_POST_MAX_SIZE: 64M
    volumes:
      - joomla-data:/var/www/html
      - ./joomla-site/templates:/var/www/html/templates
      - ./joomla-site/modules:/var/www/html/modules
      - ./joomla-site/plugins:/var/www/html/plugins
      - ./joomla-site/language:/var/www/html/language
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aas-network

  # ──────────────────────────────────────────────
  # MARIADB (Joomla DB)
  # ──────────────────────────────────────────────
  db:
    image: mariadb:11.4
    container_name: aas-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: joomla
      MYSQL_USER: joomla
      MYSQL_PASSWORD: ${JOOMLA_DB_PASSWORD:-joomla}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aas-network

  # ──────────────────────────────────────────────
  # REDIS (Cache / Sessions / Queue)
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aas-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - aas-network

  # ──────────────────────────────────────────────
  # NGINX (Reverse Proxy + SSL Termination)
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: aas-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/certs:/etc/nginx/certs:ro
      - joomla-data:/var/www/html:ro
    depends_on:
      - joomla
    networks:
      - aas-network

  # ──────────────────────────────────────────────
  # API (NestJS - Payments, Auth, Webhooks, Sync)
  # ──────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: aas-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: mysql://joomla:${JOOMLA_DB_PASSWORD:-joomla}@db:3306/joomla
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-changeme}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_PASSKEY: ${MPESA_PASSKEY}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE}
      MPESA_ENVIRONMENT: sandbox
      JOOMLA_API_URL: http://joomla:80
      JOOMLA_API_TOKEN: ${JOOMLA_API_TOKEN}
    volumes:
      - ../api:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    depends_on:
      - db
      - redis
    networks:
      - aas-network

  # ──────────────────────────────────────────────
  # MICRO-APPS (Next.js) - Development only
  # ──────────────────────────────────────────────
  booking-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nextjs
      args:
        APP_DIR: micro-apps/booking
    container_name: aas-booking
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_JOOMLA_URL: http://localhost:8080
    volumes:
      - ../micro-apps/booking:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3000"
    networks:
      - aas-network

  itinerary-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nextjs
      args:
        APP_DIR: micro-apps/itinerary-builder
    container_name: aas-itinerary
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_JOOMLA_URL: http://localhost:8080
    volumes:
      - ../micro-apps/itinerary-builder:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3002:3000"
    networks:
      - aas-network

  agent-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nextjs
      args:
        APP_DIR: micro-apps/agent-portal
    container_name: aas-agent
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_JOOMLA_URL: http://localhost:8080
    volumes:
      - ../micro-apps/agent-portal:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3003:3000"
    networks:
      - aas-network

volumes:
  joomla-data:
  db-data:
  redis-data:

networks:
  aas-network:
    driver: bridge