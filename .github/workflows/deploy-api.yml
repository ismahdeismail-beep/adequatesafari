name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'docker/Dockerfile.api'
      - 'docker/docker-compose.yml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy over SSH (optional)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check for deploy secrets
        id: check
        run: echo "enabled=${{ secrets.API_DEPLOY_HOST != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.check.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          API_PATH: ${{ secrets.API_DEPLOY_PATH }}
        with:
          host: ${{ secrets.API_DEPLOY_HOST }}
          username: ${{ secrets.API_DEPLOY_USER }}
          key: ${{ secrets.API_DEPLOY_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,API_PATH
          script: |
            cd "$API_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull api
            docker compose up -d api
            docker image prune -f

      - name: Skipped notice
        if: steps.check.outputs.enabled != 'true'
        run: |
          echo "::notice::Image pushed to ghcr.io/${GITHUB_REPOSITORY,,}/api but API_DEPLOY_HOST/USER/KEY/PATH secrets are not set — remote deploy skipped."
